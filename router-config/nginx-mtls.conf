server {
    listen 443 ssl;
    server_name chronoshield.onion;

    ssl_certificate /etc/ssl/certs/chrono_server.crt;
    ssl_certificate_key /etc/ssl/private/chrono_server.key;

    ssl_client_certificate /etc/ssl/certs/chrono_ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-Cert-Verified "SUCCESS";
    }
}
